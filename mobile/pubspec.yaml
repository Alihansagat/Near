name: near
description: A private, cozy space for two people apart.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  provider: ^6.1.2
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  file_picker: ^10.3.10
  video_player: ^2.10.1
  audioplayers: ^6.5.1
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/stitch/Newsreader-Regular.ttf
        - asset: assets/fonts/stitch/Newsreader-Bold.ttf
          weight: 700
        - asset: assets/fonts/stitch/Newsreader-Italic.ttf
          style: italic
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/stitch/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/stitch/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/stitch/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/stitch/PlusJakartaSans-Bold.ttf
          weight: 700
  assets:
    - assets/mascots/hearts-moods.png
    - assets/maps/land.json
