version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  file_picker: ^10.3.10
  video_player: ^2.10.1
  audioplayers: ^6.5.1
