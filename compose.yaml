services:
  db:
    image: postgres:16-alpine
    env_file: backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
  api:
    build: backend
    env_file: backend/.env
    ports: ["8000:8000"]
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
